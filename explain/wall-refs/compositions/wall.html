      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

      // ---- layout ----

      const camById = {};

      const given = D.given.map((g) => ({ id: g.id, seq: g.seq, cand: g.cand, gps: wf(g.gps), cam: camById[g.id] }));
      const cands = given.filter((g) => g.cand);
      const ptsF = D.pf.map(wf), ptsL = D.pl.map((p) => wf(p)), ptsH = D.pl.map((p) => p[2]);
      // final -> first is one similarity in plan; fit it from the cameras
      const sim = (() => {
        let gx = 0, gy = 0, fx = 0, fy = 0;
        cams.forEach((c) => { gx += c.final[0]; gy += c.final[1]; fx += c.first[0]; fy += c.first[1]; });
        gx /= cams.length; gy /= cams.length; fx /= cams.length; fy /= cams.length;
        let ar = 0, ai = 0, den = 0;
        cams.forEach((c) => {
          const px = c.final[0] - gx, py = c.final[1] - gy, qx = c.first[0] - fx, qy = c.first[1] - fy;
          ar += qx * px + qy * py; ai += qy * px - qx * py; den += px * px + py * py;
        });
        ar /= den; ai /= den;
        return (p) => { const x = p[0] - gx, y = p[1] - gy; return [fx + ar * x - ai * y, fy + ai * x + ar * y]; };
      })();
      const pair = D.pair;
      const pairPts = pair.pts.map((q) => ({ a: [q[0], q[1]], b: [q[2], q[3]], first: sim(wf([q[4], q[5]])), on: q[7] }));
      const camA = camById[pair.a], camB = camById[pair.b];
      const OFF = D.wall.plane_offset_m;
      const near = D.near.map((q) => ({ s: q[0], d: q[1], h: q[2], on: Math.abs(q[1] - OFF) < 0.12 && q[0] > -0.5 && q[0] < LEN + 0.5 && q[2] > 0.3 }));

      const treePts = near.filter((q) => q.h > 3.5 && q.d > 1.5 && q.d < 5.6), truckPts = near.filter((q) => q.h < 3.5 && q.d > 5);
      const mean = (a, f) => a.reduce((n, q) => n + f(q), 0) / a.length;
      const TREE = [mean(treePts, (q) => q.s), mean(treePts, (q) => q.d) + 0.12], TRUCK = [mean(truckPts, (q) => q.s), Math.max(...truckPts.map((q) => q.d)) + 0.5];

      const CAM = {
        district: { s: -60, d: -50, k: 2.8, ax: 1260, ay: 540 },

        near: { s: 6, d: 0, k: 18, ax: 1230, ay: 640 },
        near2: { s: 5, d: 0, k: 26, ax: 1230, ay: 420 },
        wall: { s: MID[0], d: 0, k: 105, ax: 1260, ay: 235 },
      };
      const camMix = (a, b, u) => ({ s: lerp(a.s, b.s, u), d: lerp(a.d, b.d, u), k: Math.exp(lerp(Math.log(a.k), Math.log(b.k), u)), ax: lerp(a.ax, b.ax, u), ay: lerp(a.ay, b.ay, u) });
      function camAt(t) {

        if (t < 19.8) return camMix(CAM.district, CAM.mid, io(seg(t, 18.4, 19.8)));
        if (t < 22.6) return CAM.mid;
        if (t < 23.8) return camMix(CAM.mid, CAM.near, io(seg(t, 22.6, 23.8)));
        if (t < 45.0) return CAM.near;
        if (t < 46.4) return camMix(CAM.near, CAM.near2, io(seg(t, 45.0, 46.4)));

      const pr = (p, c) => [c.ax + (p[0] - c.s) * c.k, c.ay + (p[1] - c.d) * c.k];

      // ---- the flattening warp: a homography from the wall's outline in a photo to a rectangle ----
      function homog(s, d) {
        const A = [];
        for (let i = 0; i < 4; i++) {
          const x = s[i][0], y = s[i][1], u = d[i][0], v = d[i][1];
          A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u]);
          A.push([0, 0, 0, x, y, 1, -v * x, -v * y, v]);
        }
        for (let c = 0; c < 8; c++) {
          let m = c;
          for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;

          for (let r = 0; r < 8; r++) {

            const f = A[r][c] / A[c][c];
            for (let j = c; j < 9; j++) A[r][j] -= f * A[c][j];

      }

            else { R = cell; a = seg(t, 9.0 + 0.12 * k, 9.3 + 0.12 * k); blur = (1 - a) * 10; }
            const u = io(seg(t, 14.0, 15.2));
            if (u > 0) { const s = pr(viewGps[k], cD); R = rl(R, { x: s[0] - 6, y: s[1] - 4.5, w: 12, h: 9 }, u); a *= 1 - seg(t, 14.5, 15.2); }
            q = io(seg(t, 10.8 + 0.1 * k, 11.6 + 0.1 * k));
          } else if (t >= 67.4 && t < 81.4) {
            if (k === 0) { R = rl(PB, slotT(0), io(seg(t, 74.4, 75.4))); a = seg(t, 67.4, 67.7); blur = (1 - a) * 10; a *= 1 - 0.5 * seg(t, 70.2, 71.2); q = io(seg(t, 68.2, 69.0)); }
            else { R = slotT(k); a = seg(t, tk, tk + 0.25); blur = (1 - a) * 8; a *= 1 - 0.5 * seg(t, tk + 0.3, tk + 0.9); }
            a *= 1 - seg(t, 81.0, 81.4);
          }
          if (R) { put(ph[k], R, 1280, a, blur); qd[k].setAttribute("stroke-dashoffset", 1 - q); qd[k].setAttribute("stroke-width", (4 * 1280) / R.w); }
          else ph[k].style.opacity = 0;

          // the warp
          if (k === 0 && t >= 6.0 && t < 7.4) setWarp(0, PB, PL, 1 - io(seg(t, 6.0, 7.4)), 1);
          else if (k === 0 && t >= 70.2 && t < 72.1) setWarp(0, PB, PL, io(seg(t, 70.2, 71.8)), 1 - seg(t, 71.8, 72.05));
          else if (k > 0 && t >= tk + 0.3 && t < tk + 1.4) setWarp(k, slotT(k), slotS(k), io(seg(t, tk + 0.3, tk + 1.1)), 1 - seg(t, tk + 1.1, tk + 1.35));
          else warps[k].el.style.opacity = 0;

          // the flattened view
          let F = null, fa = 0;
          if (t >= 71.8 && t < 97.0) {
            if (k === 0) { F = rl(PL, slotS(0), io(seg(t, 74.4, 75.4))); fa = seg(t, 71.8, 72.05); }
            else { F = slotS(k); fa = seg(t, tk + 1.1, tk + 1.35); }
            const u = io(seg(t, 81.2 + 0.06 * k, 82.3 + 0.06 * k));
            if (u > 0) { F = rl(F, ST, u); fa *= lerp(1, 1 / (k + 1), u); }
          }
          if (F) put(fl[k], F, 711, fa, 0); else fl[k].style.opacity = 0;

          // the window, cut from each view; its value; sorted
          const aP = seg(t, 87.4 + 0.08 * k, 87.7 + 0.08 * k) * (1 - seg(t, 100.3, 100.7));
          put(pt[k], { x: 600 + k * 196, y: 290, w: 180 }, 180, aP, (1 - seg(t, 87.4 + 0.08 * k, 87.7 + 0.08 * k)) * 8);
          const us = io(seg(t, 92.6, 93.4)), mid = rank[k] === 2 || rank[k] === 3;
          const aS = seg(t, 91.9 + 0.05 * k, 92.1 + 0.05 * k) * (1 - seg(t, 100.3, 100.7));
          put(sw[k], { x: lerp(600 + k * 196, 600 + rank[k] * 196, us), y: lerp(486, 600, us), w: 180 }, 180, aS, 0);
          sw[k].style.outline = mid && t > 93.7 ? `4px solid ${ACC}` : "none";
          // the flip-book: one view after another, then all six averaged
          const f = (t - 82.6) / 0.43;
          mg[k].style.opacity = (k === 0 ? 1 : clamp((f - k) / 0.25)) * lerp(1, 1 / (k + 1), seg(t, 85.4, 86.2));
        }
        const aMag = vis(t, 82.2, 87.4, 0.3, 0.3);
        put($("w-mag"), { x: 600, y: 290, w: 990 }, 990, aMag, (1 - aMag) * 8);
        put($("w-ptf"), { x: 600, y: 790, w: 180 }, 180, seg(t, 96.0, 96.4) * (1 - seg(t, 100.3, 100.7)), 0);
        put($("w-fused"), ST, 711, seg(t, 95.8, 96.8), 0);
        const aBest = t < 50 ? 1 - seg(t, 6.0, 6.2) : seg(t, 100.8, 101.2);
        put($("w-best"), t < 50 ? PL : BEST, 711, aBest, t < 50 ? 0 : (1 - aBest) * 8);
        const aPair = vis(t, 32.5, 40.6, 0.3, 0.4);
        put($("w-pa"), PA, 1280, aPair, (1 - aPair) * 8); put($("w-pb"), PBR, 1280, aPair, (1 - aPair) * 8);
      }

      function drawText(t) {
        for (const x of TEXT) {
          const v = vis(t, x.a, x.b);
          x.el.style.opacity = v;
          x.el.style.filter = v > 0 && v < 1 ? `blur(${((1 - v) * 8).toFixed(2)}px)` : "none";
        }
      }

      function renderAt(t) { drawMap(t); drawDom(t); drawOver(t); drawText(t); }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      renderAt(0);
      window.__timelines["wall"] = tl;
    })();
  </script>
</template>
