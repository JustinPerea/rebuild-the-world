  <script type="module">
    import * as THREE from "three";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
    import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
    import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
    import { LineMaterial } from "three/addons/lines/LineMaterial.js";

    const W = 1080,
      H = 1920,
      DUR = 28.6;
    // local seconds
    const T_CLAIM = 0.95,
      T_WIRE = 1.85,
      T_CLAY = 2.5,
      T_MAT = 3.5,
      T_LIGHT = 5.3,
      T_CHECK = 15.8,
      T_SNAP = 18.4,
      T_HIT = 19.45,
      T_SPEC = 20.6,
      T_UNLOCK = 23.0;

    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const lerp = (a, b, k) => a + (b - a) * k;
    const smooth = (a, b, x) => {
      const k = clamp01((x - a) / (b - a));
      return k * k * (3 - 2 * k);
    };

    const canvas = document.getElementById("s-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.localClippingEnabled = true;

    const BG = new THREE.Color("#cdc8c0");
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(BG, 5, 16);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
    const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 60);

    const key = new THREE.DirectionalLight("#fff3e2", 3);
    key.position.set(2.2, 3.4, 2.6);
    key.castShadow = true;
    key.shadow.mapSize.set(4096, 4096);
    key.shadow.camera.left = -2.9;
    key.shadow.camera.right = 2.9;
    key.shadow.camera.top = 1.6;
    key.shadow.camera.bottom = -1.6;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 9;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.004;
    key.shadow.radius = 5;
    scene.add(key);
    const rim = new THREE.DirectionalLight("#bcd2ff", 1.2);
    rim.position.set(-2.5, 1.6, -2.2);
    scene.add(rim);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: "#b9b4ac", roughness: 0.7, metalness: 0 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // ---------- textures ----------
    const treadTex = (() => {
      const c = document.createElement("canvas");
      c.width = 2048;
      c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = "#909090";
      g.fillRect(0, 0, c.width, c.height);
      const y0 = 0.33 * 256,
        y1 = 0.67 * 256;
      // tread blocks stand proud, grooves are cut in
      g.fillStyle = "#c8c8c8";
      g.fillRect(0, y0, c.width, y1 - y0);
      g.strokeStyle = "#1c1c1c";
      g.lineWidth = 7;
      for (const f of [0.2, 0.42, 0.58, 0.8]) {
        const y = lerp(y0, y1, f);
        g.beginPath();
        g.moveTo(0, y);
        g.lineTo(c.width, y);
        g.stroke();
      }
      g.lineWidth = 4;
      const N = 84;
      for (let i = 0; i < N; i++) {
        const x = (i / N) * c.width;
        g.beginPath();
        g.moveTo(x, y0 - 4);
        g.lineTo(x + 12, lerp(y0, y1, 0.2));
        g.moveTo(x + 6, lerp(y0, y1, 0.2));
        g.lineTo(x + 20, lerp(y0, y1, 0.42));
        g.moveTo(x + 20, lerp(y0, y1, 0.58));
        g.lineTo(x + 6, lerp(y0, y1, 0.8));
        g.moveTo(x + 12, lerp(y0, y1, 0.8));
        g.lineTo(x, y1 + 4);
        g.stroke();
      }
      // sidewall ribs
      g.strokeStyle = "#a8a8a8";
      g.lineWidth = 2;
      for (const y of [0.1, 0.13, 0.26, 0.74, 0.87, 0.9]) {
        g.beginPath();
        g.moveTo(0, y * 256);
        g.lineTo(c.width, y * 256);
        g.stroke();
      }
      const t = new THREE.CanvasTexture(c);
      t.wrapS = THREE.RepeatWrapping;
      t.anisotropy = 8;
      return t;
    })();
    const discTex = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#808080";
      g.fillRect(0, 0, 512, 512);
      g.strokeStyle = "#8c8c8c";
      for (let r = 20; r < 256; r += 3) {
        g.lineWidth = 1;
        g.globalAlpha = 0.25 + 0.5 * (((r * 7) % 5) / 5);
        g.beginPath();
        g.arc(256, 256, r, 0, Math.PI * 2);
        g.stroke();
      }
      return new THREE.CanvasTexture(c);
    })();

    // ---------- geometry (wheel axis = X, outboard = +X) ----------
    const toX = (g) => g.rotateZ(-Math.PI / 2);
    const cylX = (r, len, x0, seg = 48, r2 = r) => toX(new THREE.CylinderGeometry(r2, r, len, seg).translate(0, x0 + len / 2, 0));
    function lathe(ctrl, n, seg) {
      const curve = new THREE.CatmullRomCurve3(
        ctrl.map(([r, x]) => new THREE.Vector3(r, x, 0)),
        false,
        "catmullrom",
        0.35,
      );
      const pts = curve.getSpacedPoints(n).map((p) => new THREE.Vector2(p.x, p.y));
      return toX(new THREE.LatheGeometry(pts, seg));
    }
    function buildWheel(q) {
      const S = q ? 160 : 28;
      const parts = [];
      // tyre
      parts.push({
        m: "tyre",
        g: lathe(
          [
            [0.231, -0.103], [0.243, -0.113], [0.272, -0.121], [0.303, -0.119], [0.324, -0.106], [0.334, -0.086],
            [0.337, -0.05], [0.338, 0], [0.337, 0.05],
            [0.334, 0.086], [0.324, 0.106], [0.303, 0.119], [0.272, 0.121], [0.243, 0.113], [0.231, 0.103],
          ],
          q ? 64 : 12,
          S,
        ),
      });
      // rim barrel with lips
      parts.push({
        m: "alloy",
        g: lathe(
          [
            [0.222, 0.1], [0.236, 0.104], [0.239, 0.098], [0.232, 0.09], [0.214, 0.082], [0.2, 0.06],
            [0.196, 0], [0.2, -0.06], [0.214, -0.082], [0.232, -0.09], [0.239, -0.098], [0.236, -0.104], [0.222, -0.1],
          ],
          q ? 40 : 10,
          S,
        ),
      });
      // spokes: five pairs
      const sh = new THREE.Shape();
      sh.moveTo(-0.02, 0.045);

    // ---------- materials ----------

    // ---------- the wheel in its four states ----------

    // ---------- Clawd, built from the 12 x 8 pixel grid of the official front view ----------

    function makeClawdGeo(u) {
      const parts = [];
      const box = (cx, cy, cz, w, h, d, col) => {

      box(5, 5, 0, 2, 2, 3, O);
      for (const cx of [-3.5, -1.5, 1.5, 3.5]) for (const cz of [2, -2]) box(cx, 1, cz, 1, 2, 1, O); // legs: columns 2, 4, 7, 9

    const V = (x, y, z) => new THREE.Vector3(x, y, z);

    const pA = V(0, 0, 0), pB = V(0, 0, 0), pC = V(0, 0, 0);

      const scatter = smooth(T_LIGHT + 0.1, T_LIGHT + 0.6, t);

        // B: four line up for the checks, three wait by the wheel

    // =====================================================================

    const mini = [];

    // 1. the wheel becomes a car
    {
